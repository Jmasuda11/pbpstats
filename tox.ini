[tox]
envlist = py38, py39, py310, py311, py312
skipsdist = True

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312

[testenv]
usedevelop = true
deps =
    requests>=2.27.1,<3
    pytest>=7.0.1,<8
    responses>=0.18.0,<0.19
    furl>=2.1.3,<3
commands = python -m pytest
